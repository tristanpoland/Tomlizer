[package]
name = "tomlizer"
version = "0.1.0"
edition = "2021"

[workspace]
# This is a standalone tool, not part of the main workspace

[[bin]]
name = "tomlizer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
owo-colors = "3"
spinners = "4.2.0"
toml_edit = "0.25"
walkdir = "2.3"
